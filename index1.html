<body>
    <main class="welcome">

            <header class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 4C24 4 9 20 9 30a15 15 0 0 0 30 0C39 20 24 4 24 4Z" fill="currentColor"/>
        <path d="M18 31a6 6 0 0 0 6 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
      </svg>
      <h1>DROP</h1>
      <p class="tagline">Drop it. We'll organize it.</p>
    </header>

    <ul class="steps">
      <li>
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M12 5v10m0 0-4-4m4 4 4-4M5 19h14"/></svg>
        </span>
        <div>
          <strong>Drop anything in</strong>
          <span>Screenshots, messages, files, notes.</span>
        </div>
      </li>
      <li>
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 7"/></svg>
        </span>
        <div>
          <strong>DROP prepares it</strong>
          <span>Tasks, deadlines, reminders, replies.</span>
        </div>
      </li>
      <li>
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3Z"/></svg>
        </span>
        <div>
          <strong>You approve</strong>
          <span>Nothing happens until you say yes.</span>
        </div>
      </li>
    </ul>

    <p class="promise">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      DROP never acts without your permission.
    </p>

    <footer class="actions">
